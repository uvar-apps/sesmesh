name: CI

# Manual only (Actions → CI → Run workflow): every push is validated locally
# first with the same steps (docs/release.md, "Local validation").
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS arm64, Linux x86-64, Linux arm64, Windows x86-64 (Spec NFR-PORT tier 1)
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (debug)
        run: cargo test --workspace --locked
      - name: test (release)
        run: cargo test --workspace --locked --release
      # Plan T10.1: the library examples run on every tier-1 target.
      - name: examples
        shell: bash
        run: |
          for example in file_to_obj spheres_to_mesh trajectory custom_radii field_queries; do
            cargo run -q --release --locked -p sesmesh --example "$example"
          done
      # Plan T6.6: which kernel each --simd choice runs on this runner, with
      # the time of a small surface (the per-level equivalence tests ran in
      # the test steps above).
      - name: SIMD level matrix
        shell: bash
        run: |
          {
            echo "### SIMD levels on ${{ matrix.os }}"
            echo
            echo "| --simd | kernel | 1CRN at 0.25 Å |"
            echo "|---|---|---|"
            for level in auto scalar sse4.2 avx2 avx512 neon; do
              line=$(cargo run -q --release --locked -p sesmesh-cli -- \
                tests/data/fixtures/1CRN.cif.gz -s 0.25 --simd "$level" -o - --timings 2>&1 >/dev/null \
                | grep -E "time:|error" || true)
              if [[ "$line" == *"kernel)"* ]]; then
                kernel=$(sed -E 's/.*, ([a-z0-9.-]+) kernel\).*/\1/' <<<"$line")
                total=$(sed -E 's/.*\(([0-9.]+ ms), .*/\1/' <<<"$line")
                echo "| $level | $kernel | $total |"
              else
                echo "| $level | not available | |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in the workspace Cargo.toml.
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package sesmesh --package sesmesh-cli --locked
