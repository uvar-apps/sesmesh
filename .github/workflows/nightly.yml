name: Nightly

# Long-running checks that are too slow for every push.
# Fuzz smoke runs (cargo-fuzz, nightly toolchain) are added here with the
# first fuzz targets (Plan T1.12); data-set tests with Plan T5.5.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  long-tests:
    name: ignored tests (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --release -- --include-ignored
