# Release automation (Plan T10.4, docs/release.md).
#
# * Push a tag `vX.Y.Z` → build the `sesmesh` binary for the tier-1 targets
#   with the `dist` profile, package it with the docs and licences, write
#   SHA-256 checksums and create a draft GitHub release with the archives.
# * Run manually (workflow_dispatch) → the same builds as a dry run (archives
#   as workflow artifacts, no release); with `publish-crates` the crates are
#   also published to crates.io (`sesmesh`, then `sesmesh-cli`) using the
#   `CARGO_REGISTRY_TOKEN` secret.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-crates:
        description: "Publish sesmesh and sesmesh-cli to crates.io"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --profile dist --locked -p sesmesh-cli --target ${{ matrix.target }}
      - name: smoke test
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/dist/sesmesh
          "$bin" --version
          "$bin" tests/data/fixtures/1CRN.cif.gz -q draft -o - --quiet > /dev/null
      - name: package
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='sesmesh-cli'))")
          name="sesmesh-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=sesmesh
          [[ "${{ matrix.target }}" == *windows* ]] && exe=sesmesh.exe
          cp "target/${{ matrix.target }}/dist/$exe" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          mkdir -p "dist/$name/docs"
          cp docs/cli.md docs/04-output-formats.md "dist/$name/docs/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            file="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            file="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "$file.sha256"; else shasum -a 256 "$file" > "$file.sha256"; fi
          echo "ARCHIVE=dist/$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: sesmesh-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256

  release:
    name: GitHub release (draft)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: cd artifacts && cat *.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "sesmesh ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for the changes in this release." \
            artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS

  publish:
    name: crates.io
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-crates
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: publish (sesmesh, then sesmesh-cli)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
