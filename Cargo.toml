# sesmesh — Solvent Excluded Surface meshes for molecules
# Copyright (c) 2026 Ugo Varetto
# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = [
    "crates/sesmesh",
    "crates/sesmesh-cli",
    "crates/sesmesh-testkit",
    "xtask",
]
exclude = ["fuzz"]
default-members = [
    "crates/sesmesh",
    "crates/sesmesh-cli",
    "crates/sesmesh-testkit",
]

[workspace.package]
version = "1.1.1"
edition = "2024"
# Highest MSRV among planned dependencies (fearless_simd 1.2: 1.89).
# See docs/03-implementation-plan.md §2. Checked by the `msrv` CI job.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Ugo Varetto"]
repository = "https://github.com/uvar-apps/sesmesh"
homepage = "https://uvar-apps.github.io/sesmesh/"
# Only `sesmesh` and `sesmesh-cli` are publishable (Plan T10.4); `cargo
# publish` is run by hand or by the release workflow, never implicitly.

[workspace.dependencies]
sesmesh = { path = "crates/sesmesh", version = "1.1.1" }
sesmesh-testkit = { path = "crates/sesmesh-testkit" }

# Versions follow docs/03-implementation-plan.md §2; add entries when a phase
# first needs them.
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
ctrlc = "3.5"
criterion = "0.8"
fast-float2 = "0.2"
fearless_simd = { version = "1.2", features = ["force_support_fallback"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
memchr = "2.8"
proptest = "1.12"
rayon = "1.12"
rustc-hash = "2.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
thiserror = "2.0"
toml = "1.2"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

[profile.release]
lto = "thin"
debug = "line-tables-only"

# Distribution binaries (Plan T10.4): `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# Benchmarks and profiling keep full debug info.
[profile.bench]
debug = true
