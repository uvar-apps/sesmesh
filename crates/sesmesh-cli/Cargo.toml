[package]
name = "sesmesh-cli"
description = "Command-line tool computing Solvent Excluded Surfaces (Connolly surfaces) of molecules as triangle meshes (OBJ, PLY, MSMS)"
readme = "../../README.md"
keywords = ["molecular-surface", "ses", "connolly", "mesh", "cli"]
categories = ["science", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "sesmesh"
path = "src/main.rs"
# Avoid a rustdoc output collision with the `sesmesh` library.
doc = false

[dependencies]
sesmesh.workspace = true
clap.workspace = true
rayon.workspace = true
serde_json.workspace = true

[dev-dependencies]
sesmesh-testkit.workspace = true

[lints]
workspace = true
