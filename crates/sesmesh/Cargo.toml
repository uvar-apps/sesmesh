[package]
name = "sesmesh"
description = "Solvent Excluded Surface (Connolly surface) meshing for molecular structures"
readme = "../../README.md"
keywords = ["molecular-surface", "ses", "connolly", "mesh", "pdb"]
categories = ["science", "graphics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["parallel", "gzip", "radii-file"]
# Multi-threading with rayon (Design §11.1).
parallel = ["dep:rayon"]
# Transparent gzip decompression of inputs (flate2 + zlib-rs).
gzip = ["dep:flate2"]
# TOML custom radius files (Spec FR-RAD-3).
radii-file = ["dep:serde", "dep:toml"]

[dependencies]
fast-float2.workspace = true
flate2 = { workspace = true, optional = true }
memchr.workspace = true
rayon = { workspace = true, optional = true }
rustc-hash.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
flate2.workspace = true

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true
