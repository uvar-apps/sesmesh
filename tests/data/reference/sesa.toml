# negative), measured by tools/compare/meshcheck; cavities = closed
# components with negative volume; dist_* = distance of the mesh vertices
# to the exact SES of the same spheres (sesmesh's SesField).

[provenance]
program = "sesa V001 (github.com/wlincong/SESexact, sesaV001.tar.gz Linux binary)"
command = "sesa ID.pdb"
spheres = "own CHARMM radii, adds hydrogens (not comparable sphere by sphere); atoms: sesmesh default selection (first model, no H or waters, highest-occupancy alt-locs), Bondi radii, probe 1.4 A"
machine = "AMD Ryzen AI Max+ 395 (16 cores), Ubuntu 24.04 container (tools/compare/Containerfile)"
date = "2026-11-14"

